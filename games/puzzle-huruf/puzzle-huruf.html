<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Puzzle Huruf & Kata Islami — PlayLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(160deg, #0f3460 0%, #16213e 40%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      color: #fff; padding: 14px 12px 20px;
      overflow-x: hidden; position: relative;
    }

    /* Animated bg stars */
    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.18) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.15) 0%, transparent 50%);
      pointer-events:none;
    }

    .topbar {
      width: 100%; max-width: 560px; position: relative; z-index:2;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
      padding: 8px 16px; border-radius: 999px;
      box-shadow: 0 0 0 1.5px rgba(255,255,255,0.18), 0 8px 24px rgba(0,0,0,0.3);
      font-weight: 700; font-size: 15px; margin-bottom: 8px;
    }
    .score-pill {
      display: flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #ffd700, #ff9f00);
      padding: 4px 14px; border-radius: 999px;
      color: #1a0000; font-size: 14px; font-weight: 700;
      box-shadow: 0 3px 8px rgba(255,180,0,0.4);
    }
    .round-pill {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15);
      padding: 4px 14px; border-radius: 999px;
      font-size: 14px;
    }
    .btn-reset {
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 5px 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.3);
      color: #fff; background: rgba(231,76,60,0.7); cursor: pointer;
      backdrop-filter: blur(4px);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-reset:active { transform: scale(0.95); }

    h1 {
      font-size: clamp(22px, 5.5vw, 30px); color: #fff;
      -webkit-text-stroke: 3px rgba(99,102,241,0.8); paint-order: stroke fill;
      text-shadow: 0 0 20px rgba(99,102,241,0.5), 0 4px 0 rgba(0,0,0,0.3);
      text-align: center; margin: 6px 0 4px;
      position: relative; z-index:2;
    }
    .subtitle {
      text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600;
      margin-bottom: 10px; position:relative; z-index:2;
    }

    /* Clue Card */
    .clue-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      padding: 14px 20px 16px; text-align: center;
      max-width: 480px; width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      margin-bottom: 10px; position:relative; z-index:2;
    }
    .clue-meaning {
      font-size: 13px; color: rgba(255,255,255,0.55); font-weight: 600; margin-bottom: 2px;
    }
    .clue-latin {
      font-size: 20px; font-weight: 700; color: #10d9c4;
      text-shadow: 0 0 14px rgba(16,217,196,0.5);
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    /* === RTL ARABIC SLOTS ===
       Slot dibangun dari kanan ke kiri di DOM:
       - Slot ke-0 (huruf Arab pertama) ada di PALING KANAN secara visual
       - Menggunakan display:flex biasa, TAPI urutan DOM-nya dibalik saat build
       - Sehingga slot[0] = kanan, slot[1] = satu ke kiri, dst.
    */
    .target-slots {
      display: flex;
      flex-direction: row;   /* DOM sudah dibalik saat build, tidak perlu row-reverse */
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .slot {
      width: 54px; height: 62px;
      border: 2.5px dashed rgba(16,217,196,0.5); border-radius: 14px;
      background: rgba(16,217,196,0.06);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Amiri', serif; font-size: 36px; font-weight: 700;
      color: #10d9c4;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .slot.filled {
      border-style: solid; border-color: #10d9c4;
      background: rgba(16,217,196,0.18);
      transform: scale(1.06);
      box-shadow: 0 0 16px rgba(16,217,196,0.3);
    }
    .slot.correct {
      border-color: #2ecc71; background: rgba(46,204,113,0.2);
      box-shadow: 0 0 20px rgba(46,204,113,0.4);
    }
    .slot.wrong {
      border-color: #e74c3c; background: rgba(231,76,60,0.18);
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-5px)}
      75%{transform:translateX(5px)}
    }

    /* Posisi huruf: angka kecil di bawah slot (1=kanan, 2=berikutnya kiri, dst) */
    .slot-order {
      position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
      font-size:10px; font-weight:700; color:rgba(255,255,255,0.3); font-family:'Fredoka',sans-serif;
    }

    /* Tiles Pool */
    .tiles-pool {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      max-width: 480px; margin: 8px 0;
      position: relative; z-index:2;
    }
    .tile {
      width: 58px; height: 66px; border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      backdrop-filter: blur(8px);
      box-shadow: 0 5px 0 rgba(0,0,0,0.35), 0 8px 18px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Amiri', serif; font-size: 38px; font-weight: 700; color: #fff;
      cursor: pointer;
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.12s;
    }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 9px 0 rgba(0,0,0,0.35), 0 12px 24px rgba(99,102,241,0.3); }
    .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
    .tile.used { opacity: 0.25; pointer-events: none; filter: grayscale(1); }

    .helper-text {
      color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 600;
      text-align: center; margin-top: 6px;
      position: relative; z-index:2;
    }

    /* Progress dots */
    .progress-dots {
      display: flex; gap: 8px; justify-content: center; margin-top: 8px;
      position: relative; z-index:2;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.2); transition: all 0.3s;
    }
    .dot.done { background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,0.6); }
    .dot.active { background: #10d9c4; box-shadow: 0 0 8px rgba(16,217,196,0.6); transform: scale(1.2); }

    /* Victory Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: linear-gradient(160deg, #1e2a4a, #131b35);
      border: 2px solid rgba(99,102,241,0.4);
      border-radius: 28px; padding: 30px;
      text-align: center; max-width: 380px; width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 40px rgba(99,102,241,0.2);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .btn-play-again {
      font-family: inherit; font-size: 18px; font-weight: 700;
      padding: 14px 32px; border-radius: 16px; border: 2.5px solid rgba(255,255,255,0.3);
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 6px 0 rgba(79,70,229,0.7), 0 10px 30px rgba(99,102,241,0.4);
      cursor: pointer; margin-top: 18px;
      transition: transform 0.1s;
    }
    .btn-play-again:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(79,70,229,0.7); }

    /* Confetti burst (CSS only) */
    .burst { position:fixed; top:50%; left:50%; pointer-events:none; z-index:200; }
    .burst span {
      position:absolute; width:10px; height:10px; border-radius:50%;
      animation: burst-fly 1s ease-out forwards;
    }
    @keyframes burst-fly {
      to { transform: translate(var(--tx), var(--ty)) scale(0); opacity:0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="score-pill">⭐ <span id="scoreVal">0</span></div>
    <div class="round-pill">📖 <span id="roundVal">1/6</span></div>
    <button class="btn-reset" id="btnResetWord">Hapus ↺</button>
  </div>

  <h1>PUZZLE ✦ HURUF ISLAMI</h1>
  <p class="subtitle">Susun huruf Arab dari kanan ke kiri ← membentuk kata berkah!</p>

  <div class="progress-dots" id="progressDots"></div>

  <div style="height:10px;"></div>

  <div class="clue-card">
    <div class="clue-meaning" id="clueMeaning">Arti: Tuhan Semesta Alam</div>
    <div class="clue-latin" id="clueLatin">ALLAH</div>
    <!-- RTL slots: flex-direction: row-reverse → huruf ke-1 di paling kanan -->
    <div class="target-slots" id="slotsContainer"></div>
  </div>

  <div class="tiles-pool" id="tilesContainer"></div>

  <div class="helper-text" id="helperText">
    ← Ketuk huruf & susun dari kanan ke kiri (arah Arab)
  </div>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="modalWin">
    <div class="modal-card">
      <div style="font-size:56px; margin-bottom:8px;">🌟</div>
      <h2 style="font-size:28px; color:#10d9c4; margin-bottom:6px; -webkit-text-stroke:2px rgba(16,217,196,0.3);">MUMTAZ! SEMPURNA!</h2>
      <p style="color:rgba(255,255,255,0.6); font-weight:600; font-size:15px; line-height:1.5;">
        Masya Allah! Kamu berhasil<br>menyusun seluruh kata Islami!
      </p>
      <div style="font-size:40px; margin:14px 0; letter-spacing:4px;">★★★</div>
      <div style="color:rgba(255,255,255,0.4); font-size:13px; margin-bottom:4px;">Skor Total</div>
      <div style="font-size:36px; font-weight:700; color:#ffd700;" id="finalScore">0</div>
      <button class="btn-play-again" id="btnPlayAgain">Main Lagi ▶</button>
    </div>
  </div>

  <script>
    // Audio Synth
    let actx = null;
    function getAudio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function playSfx(notes) {
      try {
        const c = getAudio();
        notes.forEach(([f, t, d, type='sine']) => {
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f, c.currentTime + t);
          g.gain.setValueAtTime(0.18, c.currentTime + t);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + d);
          o.connect(g); g.connect(c.destination);
          o.start(c.currentTime + t); o.stop(c.currentTime + t + d);
        });
      } catch(e) {}
    }
    const SFX_TILE  = [[520, 0, 0.1]];
    const SFX_WIN   = [[523, 0, 0.12], [659, 0.1, 0.15], [784, 0.22, 0.2], [1047, 0.35, 0.4, 'triangle']];
    const SFX_ERROR = [[280, 0, 0.08, 'square'], [220, 0.09, 0.2, 'sawtooth']];
    const SFX_NEXT  = [[440, 0, 0.08], [550, 0.07, 0.08]];

    /* ─── WORD DATA ─────────────────────────────────────────────────────────────
       letters[] = urutan penulisan Arab = kanan-ke-kiri secara logika
       Slot ke-0 = huruf paling KANAN (awal kata Arab)
       Dengan flex-direction:row-reverse, slot[0] tampil di KANAN layar ✓
    ──────────────────────────────────────────────────────────────────────────── */
    const WORDS = [
      {
        latin: 'ALLAH', meaning: 'Tuhan Yang Maha Esa',
        letters: ['ا','ل','ل','ه'],
        hint: 'اَللّٰهُ'
      },
      {
        latin: 'ISLAM', meaning: 'Agama Kedamaian & Keselamatan',
        letters: ['ا','س','ل','ا','م'],
        hint: 'اِسْلَام'
      },
      {
        latin: 'MASJID', meaning: 'Tempat Ibadah Kaum Muslimin',
        letters: ['م','س','ج','د'],
        hint: 'مَسْجِد'
      },
      {
        latin: "QUR'AN", meaning: 'Kitab Suci Petunjuk Hidup',
        letters: ['ق','ر','آ','ن'],
        hint: 'قُرْآن'
      },
      {
        latin: 'SHALAT', meaning: 'Tiang Agama & Ibadah Utama',
        letters: ['ص','ل','ا','ة'],
        hint: 'صَلاة'
      },
      {
        latin: 'ZAKAT', meaning: 'Membersihkan Harta & Jiwa',
        letters: ['ز','ك','ا','ة'],
        hint: 'زَكَاة'
      }
    ];

    const DISTRACTORS = ['ب','ت','ث','ح','خ','ذ','ر','ز','ف','ق','ك','ن','و','ي','ش','غ'];

    let currentIdx = 0, score = 0;
    let filledLetters = []; // [{char, tileEl, expectedSlotIndex}]

    function buildProgressDots() {
      const wrap = document.getElementById('progressDots');
      wrap.innerHTML = WORDS.map((_, i) =>
        `<div class="dot ${i < currentIdx ? 'done' : i === currentIdx ? 'active' : ''}" id="dot${i}"></div>`
      ).join('');
    }

    function updateDots() {
      WORDS.forEach((_, i) => {
        const d = document.getElementById('dot' + i);
        if (!d) return;
        d.className = 'dot ' + (i < currentIdx ? 'done' : i === currentIdx ? 'active' : '');
      });
    }

    function loadWord() {
      const wordObj = WORDS[currentIdx];
      document.getElementById('clueLatin').textContent = wordObj.latin;
      document.getElementById('clueMeaning').textContent = `Arti: ${wordObj.meaning}`;
      document.getElementById('roundVal').textContent = `${currentIdx + 1}/${WORDS.length}`;
      document.getElementById('helperText').textContent = `← Susun "${wordObj.hint}" dari kanan ke kiri`;
      updateDots();

      filledLetters = [];

      // Build slots RTL: DOM order kanan→kiri
      // slot[0] = huruf Arab pertama = tampil di KANAN
      // Caranya: build dari index (length-1) turun ke 0, append ke container
      // Sehingga secara visual kiri→kanan = index (length-1) → ... → 1 → 0
      // = huruf terakhir (kiri) → ... → huruf pertama (kanan) ✓
      const slotsWrap = document.getElementById('slotsContainer');
      slotsWrap.innerHTML = '';
      // Buat semua slot dulu, simpan dalam array
      const slotEls = [];
      for (let i = 0; i < wordObj.letters.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = 'slot_' + i;
        const lbl = document.createElement('span');
        lbl.className = 'slot-order';
        lbl.textContent = (i + 1); // label 1 = huruf pertama Arab (kanan)
        slot.appendChild(lbl);
        slotEls[i] = slot;
      }
      // Append dari index tertinggi ke terendah → slot[0] tampil di KANAN
      for (let i = wordObj.letters.length - 1; i >= 0; i--) {
        slotsWrap.appendChild(slotEls[i]);
      }

      // Build tiles pool
      const pool = [...wordObj.letters];
      const used = new Set();
      while (pool.length < wordObj.letters.length + 3) {
        const r = DISTRACTORS[Math.floor(Math.random() * DISTRACTORS.length)];
        if (!used.has(r) || pool.filter(x => x === r).length < 2) {
          pool.push(r); used.add(r);
        }
      }
      pool.sort(() => Math.random() - 0.5);

      const tilesWrap = document.getElementById('tilesContainer');
      tilesWrap.innerHTML = '';
      pool.forEach((char) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = char;
        tile.onclick = () => selectTile(tile, char);
        tilesWrap.appendChild(tile);
      });
    }

    function selectTile(tileEl, char) {
      const wordObj = WORDS[currentIdx];
      if (filledLetters.length >= wordObj.letters.length) return;
      if (tileEl.classList.contains('used')) return;

      playSfx(SFX_TILE);
      tileEl.classList.add('used');

      const slotIndex = filledLetters.length;
      filledLetters.push({ char, tileEl, slotIndex });

      const slot = document.getElementById('slot_' + slotIndex);
      slot.textContent = char; // clear label, show char
      slot.classList.add('filled');

      // Check if all filled
      if (filledLetters.length === wordObj.letters.length) {
        checkAnswer();
      }
    }

    function checkAnswer() {
      const wordObj = WORDS[currentIdx];
      const entered = filledLetters.map(x => x.char).join('');
      const expected = wordObj.letters.join('');

      if (entered === expected) {
        // Mark all slots correct
        wordObj.letters.forEach((_, i) => {
          document.getElementById('slot_' + i).classList.add('correct');
        });
        playSfx(SFX_WIN);
        score += 100 + (10 * wordObj.letters.length);
        document.getElementById('scoreVal').textContent = score;

        spawnBurst();

        setTimeout(() => {
          currentIdx++;
          if (currentIdx >= WORDS.length) {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('modalWin').classList.add('active');
          } else {
            playSfx(SFX_NEXT);
            loadWord();
          }
        }, 900);
      } else {
        // Animate wrong
        wordObj.letters.forEach((_, i) => {
          document.getElementById('slot_' + i).classList.add('wrong');
        });
        playSfx(SFX_ERROR);
        setTimeout(() => {
          wordObj.letters.forEach((_, i) => {
            document.getElementById('slot_' + i).classList.remove('wrong');
          });
          resetCurrentWord();
        }, 500);
      }
    }

    function resetCurrentWord() {
      filledLetters.forEach(item => item.tileEl.classList.remove('used'));
      filledLetters = [];
      const wordObj = WORDS[currentIdx];
      for (let i = 0; i < wordObj.letters.length; i++) {
        const slot = document.getElementById('slot_' + i);
        if (!slot) continue;
        slot.classList.remove('filled', 'correct', 'wrong');
        slot.innerHTML = ''; // clear semua isi
        const lbl = document.createElement('span');
        lbl.className = 'slot-order';
        lbl.textContent = (i + 1);
        slot.appendChild(lbl);
      }
    }

    function spawnBurst() {
      const colors = ['#ffd700','#10d9c4','#6366f1','#2ecc71','#ff9f00','#ff6b6b'];
      const burst = document.createElement('div');
      burst.className = 'burst';
      for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        const angle = (i / 20) * 360;
        const dist = 80 + Math.random() * 80;
        const tx = Math.cos(angle * Math.PI / 180) * dist;
        const ty = Math.sin(angle * Math.PI / 180) * dist;
        s.style.cssText = `
          background:${colors[i % colors.length]};
          --tx:${tx}px; --ty:${ty}px;
          left:${-5 + Math.random()*10}px; top:${-5+Math.random()*10}px;
          width:${8+Math.random()*8}px; height:${8+Math.random()*8}px;
          border-radius:${Math.random()>0.5?'50%':'3px'};
          animation-delay:${Math.random()*0.1}s;
        `;
        burst.appendChild(s);
      }
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 1200);
    }

    document.getElementById('btnResetWord').onclick = resetCurrentWord;
    document.getElementById('btnPlayAgain').onclick = () => {
      currentIdx = 0; score = 0;
      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('modalWin').classList.remove('active');
      buildProgressDots();
      loadWord();
    };

    buildProgressDots();
    loadWord();
  </script>
</body>
</html>

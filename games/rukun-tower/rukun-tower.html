<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rukun Islam Tower — PlayLand</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Fredoka',sans-serif;font-weight:600;user-select:none;touch-action:none;background:#87ceeb;}

#gameCanvas{position:fixed;inset:0;display:block;cursor:pointer;}

/* HUD */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:max(env(safe-area-inset-top,0px),8px) 12px 0;
  pointer-events:none;display:none;
}
.hud-bar{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:rgba(255,255,255,0.93);
  backdrop-filter:blur(10px);
  border-radius:50px;
  box-shadow:0 3px 12px rgba(0,0,0,0.18),0 0 0 2px #fff;
  pointer-events:auto;
}
.chip{display:flex;align-items:center;gap:4px;font-size:15px;color:#1e3a5f;font-weight:700;}
.sep{width:1px;height:18px;background:rgba(0,0,0,0.1);}
.sp{flex:1;}
.hbtn{
  width:38px;height:38px;border-radius:11px;border:2.5px solid rgba(255,255,255,0.6);
  font-size:17px;cursor:pointer;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,0.25);
}
.hbtn-orange{background:linear-gradient(180deg,#ff9f47,#ff7310);}
#progWrap{height:7px;margin:5px 2px 0;background:rgba(0,0,0,0.1);border-radius:4px;overflow:hidden;}
#progBar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#ffd700,#ff9f00);transition:width .3s;}

/* Pop text */
#popEl{
  position:fixed;left:50%;top:28%;pointer-events:none;z-index:20;
  font-size:32px;font-weight:700;color:#ffd700;
  -webkit-text-stroke:5px #1e3a5f;paint-order:stroke fill;
  text-shadow:0 4px 0 #1e3a5f;opacity:0;transform:translate(-50%,0);white-space:nowrap;
}
#popEl.go{animation:pop .85s ease-out forwards;}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.6);}25%{opacity:1;transform:translate(-50%,0) scale(1.08);}100%{opacity:0;transform:translate(-50%,-50px);}}

/* Overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(10,20,40,.6);backdrop-filter:blur(6px);}
.ov.hidden{display:none;}
.card{
  width:100%;max-width:400px;
  background:linear-gradient(160deg,#fff,#eef6ff);
  border:4px solid #fff;border-radius:26px;padding:24px 20px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3),0 0 0 3px rgba(255,255,255,.3);
  animation:slideUp .38s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes slideUp{from{transform:translateY(28px) scale(.88);opacity:0;}}
.title{font-size:clamp(42px,12vw,62px);line-height:1;color:#fff;
  -webkit-text-stroke:7px #2f6fd6;paint-order:stroke fill;
  text-shadow:0 7px 0 #2f6fd6,0 0 28px rgba(47,111,214,.4);}
.title span{color:#ffd700;-webkit-text-stroke-color:#b45309;}
.sub{font-size:15px;font-weight:600;color:rgba(255,255,255,.85);text-shadow:0 2px 4px rgba(0,0,0,.25);margin:8px 0 0;}
.btn{
  font-family:inherit;font-weight:700;font-size:20px;
  border:3px solid rgba(255,255,255,.7);border-radius:14px;
  padding:13px 26px;color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn-green{background:linear-gradient(180deg,#4ade80,#22c55e);box-shadow:0 6px 0 #15803d,0 10px 22px rgba(34,197,94,.28);}
.btn-green:active{transform:translateY(4px);box-shadow:0 2px 0 #15803d;}
.btn-blue{background:linear-gradient(180deg,#60a5fa,#3b82f6);box-shadow:0 6px 0 #1d4ed8;}
.btn-blue:active{transform:translateY(4px);box-shadow:0 2px 0 #1d4ed8;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.stat-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.stat{display:flex;align-items:center;gap:5px;padding:5px 14px;border-radius:50px;
  background:linear-gradient(180deg,#fff,#e8f4ff);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 2px #fff;
  font-size:15px;font-weight:700;color:#1e3a5f;}
.stars{display:flex;gap:8px;justify-content:center;margin:8px 0;}
.star{font-size:40px;filter:grayscale(1) brightness(1.2);transition:all .5s cubic-bezier(.175,.885,.32,1.275);}
.star.lit{filter:none;animation:starPop .5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes starPop{from{transform:scale(0) rotate(-90deg);}}
.lesson-box{background:rgba(47,111,214,.08);border:2px solid rgba(47,111,214,.2);border-radius:14px;padding:12px;margin:10px 0;text-align:left;}
.arab{font-family:'Amiri',serif;font-size:32px;font-weight:700;color:#2f6fd6;text-align:center;direction:rtl;line-height:1.5;margin-bottom:4px;}
.rbadge{display:inline-block;padding:3px 14px;border-radius:50px;color:#fff;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);}
#hintEl{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:50px;
  background:rgba(255,255,255,.92);font-size:14px;font-weight:700;color:#1e3a5f;
  box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;pointer-events:none;
  animation:hintB 1.2s ease-in-out infinite;}
@keyframes hintB{50%{transform:translate(-50%,-8px);}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="popEl"></div>
<div id="hintEl">👆 Ketuk untuk jatuhkan blok!</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-bar">
    <button class="hbtn hbtn-orange" id="btnPause">⏸</button>
    <div class="chip" id="hudRukun">🕌</div>
    <div class="sep"></div>
    <div class="chip">🏗️&nbsp;<span id="hudFloor">0</span></div>
    <div class="sp"></div>
    <div class="chip">🪙&nbsp;<span id="hudCoins">0</span></div>
    <button class="hbtn hbtn-orange" id="btnMute">🔊</button>
  </div>
  <div id="progWrap"><div id="progBar"></div></div>
</div>

<!-- MENU -->
<div class="ov" id="ovMenu">
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:420px;">
    <div style="text-align:center;">
      <h1 class="title">Rukun<br><span>Tower</span></h1>
      <p class="sub">Tumpuk blok dari crane & pelajari Rukun Islam! 🏗️</p>
    </div>
    <div class="card" style="padding:18px 20px;">
      <div class="stat-row">
        <div class="stat">🏆 <span id="menuBest">0</span> lt</div>
        <div class="stat">⭐ <span id="menuStars">0</span>/3</div>
        <div class="stat">🪙 <span id="menuCoins">0</span></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-green" id="btnPlay">▶ MAIN</button>
      </div>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div class="ov hidden" id="ovPause">
  <div class="card">
    <div style="font-size:40px;">⏸</div>
    <h2 style="font-size:24px;color:#1e3a5f;margin:8px 0 16px;">JEDA</h2>
    <div class="btn-row">
      <button class="btn btn-green" id="btnResume">▶ Lanjut</button>
      <button class="btn btn-blue" id="btnPauseMenu">🏠 Menu</button>
    </div>
  </div>
</div>

<!-- LESSON -->
<div class="ov hidden" id="ovLesson">
  <div class="card">
    <span class="rbadge" id="lBadge">Rukun ke-1</span>
    <h2 style="font-size:24px;color:#2f6fd6;margin:10px 0 4px;" id="lTitle">Syahadat</h2>
    <div class="lesson-box">
      <div class="arab" id="lArab"></div>
      <div style="font-weight:700;font-size:14px;color:#1e3a5f;" id="lLatin"></div>
      <div style="font-size:13px;color:#5d7a9e;margin:2px 0 8px;" id="lMeaning"></div>
      <div style="font-size:13px;line-height:1.6;color:#2d3a4f;" id="lDesc"></div>
    </div>
    <p style="font-weight:700;color:#2f6fd6;font-size:14px;">🪙 +10 koin bonus!</p>
    <div class="btn-row"><button class="btn btn-green" id="btnLessonNext">Lanjut Bangun ▶</button></div>
  </div>
</div>

<!-- RESULT -->
<div class="ov hidden" id="ovResult">
  <div class="card">
    <h2 style="font-size:26px;color:#1e3a5f;margin-bottom:8px;" id="resTitle">Menara Rubuh!</h2>
    <div class="stars"><div class="star" id="s1">⭐</div><div class="star" id="s2">⭐</div><div class="star" id="s3">⭐</div></div>
    <div class="stat-row">
      <div class="stat">🏗️ <span id="resFloor">0</span> lt</div>
      <div class="stat">🪙 +<span id="resCoins">0</span></div>
      <div class="stat">🏆 <span id="resBest">0</span></div>
    </div>
    <div class="lesson-box" id="resLesson">
      <span class="rbadge" id="resBadge" style="margin-bottom:6px;display:inline-block;"></span>
      <div class="arab" id="resArab" style="font-size:24px;"></div>
      <div style="font-size:13px;font-weight:700;color:#1e3a5f;" id="resLatin"></div>
      <div style="font-size:12px;line-height:1.55;color:#2d3a4f;margin-top:4px;" id="resDesc"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-green" id="btnAgain">🔄 Lagi</button>
      <button class="btn btn-blue" id="btnResMenu">🏠 Menu</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// RUKUN TOWER — 2D CANVAS CRANE BLOCK STACKING GAME
// Crane di atas mengayun, klik jatuhkan blok, tumpuk gedung!
// ═══════════════════════════════════════════════════════════════

const RUKUN = [
  { n:'Syahadat', col:'#7c3aed', col2:'#6d28d9',
    a:'أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَّسُولُ اللَّهِ',
    l:'Asyhadu allaa ilaaha illallaah waasyhadu anna Muhammadar rasulullah',
    m:'Aku bersaksi tiada Tuhan selain Allah dan Muhammad adalah utusan-Nya',
    h:'Syahadat adalah pintu masuk Islam & fondasi keimanan seorang Muslim.' },
  { n:'Shalat', col:'#0284c7', col2:'#0369a1',
    a:'أَقِيمُوا الصَّلَاةَ',
    l:'Aqiimush shalaah',
    m:'Dirikanlah shalat (QS. Al-Baqarah: 43)',
    h:'Shalat 5 waktu adalah tiang agama. Amal pertama yang dihisab di hari kiamat.' },
  { n:'Zakat', col:'#059669', col2:'#047857',
    a:'وَآتُوا الزَّكَاةَ',
    l:'Wa aatuz zakaah',
    m:'Dan tunaikanlah zakat (QS. Al-Baqarah: 43)',
    h:'Zakat membersihkan harta & jiwa. Diberikan kepada 8 golongan yang berhak.' },
  { n:'Puasa', col:'#d97706', col2:'#b45309',
    a:'كُتِبَ عَلَيْكُمُ الصِّيَامُ',
    l:"Kutiba 'alaikumush shiyaam",
    m:'Diwajibkan atasmu berpuasa (QS. Al-Baqarah: 183)',
    h:'Puasa Ramadhan melatih sabar & takwa. Barangsiapa puasa dengan iman, diampuni dosa-dosanya.' },
  { n:'Haji', col:'#b45309', col2:'#92400e',
    a:'وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ',
    l:"Walillaahi 'alan naasi hijjul bait",
    m:'Mengerjakan haji wajib bagi yang mampu (QS. Ali Imran: 97)',
    h:'Haji adalah penyempurna Rukun Islam. Wajib sekali seumur hidup bagi yang mampu.' }
];

// ── SAVE DATA ──────────────────────────────────────────────────
let SV={};
try{SV=JSON.parse(localStorage.getItem('rt2d_v1'))||{};}catch(e){}
['best','coins','stars'].forEach(k=>{if(!SV[k])SV[k]=0;});
const save=()=>{try{localStorage.setItem('rt2d_v1',JSON.stringify(SV));}catch(e){}};

// ── AUDIO ──────────────────────────────────────────────────────
let AC, muted=false;
const getAC=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;};
function tone(f,t=0,d=0.14,type='sine',vol=0.14,sl=null){
  if(muted)return;
  try{const c=getAC(),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t);
    if(sl)o.frequency.exponentialRampToValueAtTime(sl,c.currentTime+t+d);
    g.gain.setValueAtTime(vol,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);
    o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d);}catch(e){}
}
const SFX={
  drop:  ()=>{ tone(200,0,.12,'square',.1); tone(320,0.1,.08,'sine',.1); },
  place: ()=>{ tone(300,0,.08,'square',.12); tone(440,.07,.12,'sine',.1); },
  perf:  ()=>{ [440,554,659,880].forEach((f,i)=>tone(f,i*.07,.15,'triangle',.14)); },
  fail:  ()=>{ tone(330,0,.1); tone(260,.1,.15,'sawtooth',.1); tone(180,.22,.3,'sawtooth',.08); },
  coin:  ()=>{ tone(880,0,.06,'sine',.1); tone(1047,.05,.1,'sine',.1); },
  lesson:()=>{ [523,659,784].forEach((f,i)=>tone(f,i*.1,.18,'triangle',.15)); },
};

// ── CANVAS SETUP ───────────────────────────────────────────────
const cv = document.getElementById('gameCanvas');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.scale(DPR, DPR);
}
window.addEventListener('resize', ()=>{ resize(); if(state==='menu')drawMenu(); });
resize();

// ── GAME CONSTANTS ─────────────────────────────────────────────
const BLOCK_H   = 52;   // block height px
const BLOCK_W0  = 200;  // starting block width
const CRANE_Y   = 80;   // crane arm y position (from top HUD)
const CAM_LEAD  = 0.35; // how much of screen is above stack top

// ── GAME STATE ─────────────────────────────────────────────────
let state = 'menu';  // menu|play|lesson|pause|over
let tower = [];      // [{x,y,w,h,col,col2}] x=center, y=top
let dropping = null; // {x,y,w,h,col,col2, vy} falling block
let swing = null;    // {x,w,h,col,col2, angle,speed, ropeLen}
let debris = [];     // [{x,y,w,h,col,vx,vy,rot,rotV,alpha}]
let particles = [];  // [{x,y,vx,vy,r,col,alpha,life}]
let floor = 0, combo = 0, sessionCoins = 0;
let camY = 0;        // camera offset (world y that maps to screen bottom platform)
let targetCamY = 0;
let shakeX = 0, shakeY = 0, shakeT = 0;

// Background elements
let clouds = [];
let buildings = [];

function initBg(){
  clouds = [];
  for(let i=0;i<8;i++){
    clouds.push({ x: Math.random()*3000-500, y: 60+Math.random()*200,
      w: 80+Math.random()*120, h: 40+Math.random()*30,
      speed: 0.2+Math.random()*0.4 });
  }
  // Distant city buildings
  buildings = [];
  for(let i=0;i<20;i++){
    const bw = 40+Math.random()*60;
    buildings.push({ x: -800+i*90+Math.random()*60, bw,
      bh: 80+Math.random()*160,
      col: `hsl(${210+Math.random()*30},${20+Math.random()*20}%,${60+Math.random()*15}%)` });
  }
}

// ── WORLD ↔ SCREEN ─────────────────────────────────────────────
// World: Y grows upward (stack). Screen: Y grows downward.
// groundWorldY = 0. screenY = H - GROUND_SY - (worldY - camY) * 1
const GROUND_SY = 90; // screen y from bottom for ground surface
function worldToScreen(wx, wy){ return { sx: W/2 + wx, sy: H - GROUND_SY - (wy - camY) }; }
function getGroundSY(){ return H - GROUND_SY; }

// ── DRAW HELPERS ───────────────────────────────────────────────
function drawRoundRect(x,y,w,h,r,fill,stroke,sw=2){
  ctx.beginPath();
  ctx.roundRect(x-w/2, y, w, h, r);
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=sw; ctx.stroke(); }
}

function drawBlock(bx, by_screen, bw, bh, col, col2, alpha=1){
  // bx = center-x screen, by_screen = top-y screen
  ctx.save();
  ctx.globalAlpha = alpha;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.roundRect(bx-bw/2+4, by_screen+4, bw, bh, 8);
  ctx.fill();

  // Main body gradient
  const grad = ctx.createLinearGradient(bx-bw/2, by_screen, bx+bw/2, by_screen+bh);
  grad.addColorStop(0, lighten(col, 0.25));
  grad.addColorStop(0.5, col);
  grad.addColorStop(1, col2);
  ctx.beginPath();
  ctx.roundRect(bx-bw/2, by_screen, bw, bh, 8);
  ctx.fillStyle = grad; ctx.fill();

  // Top highlight
  const topGrad = ctx.createLinearGradient(bx-bw/2, by_screen, bx-bw/2, by_screen+bh*0.4);
  topGrad.addColorStop(0,'rgba(255,255,255,0.32)'); topGrad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = topGrad; ctx.fill();

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx-bw/2, by_screen, bw, bh, 8); ctx.stroke();

  // Corner bolts
  const br = 5, bp = 12;
  [[bx-bw/2+bp, by_screen+bp],[bx+bw/2-bp, by_screen+bp],
   [bx-bw/2+bp, by_screen+bh-bp],[bx+bw/2-bp, by_screen+bh-bp]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.arc(cx,cy,br,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx-1.5,cy-1.5,br-2,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
  });

  // Center window pattern
  const ww = bw*0.36, wh = bh*0.5, wx = bx-ww/2, wy = by_screen+bh*0.25;
  ctx.beginPath(); ctx.roundRect(wx, wy, ww, wh, 5);
  ctx.fillStyle='rgba(255,240,160,0.5)'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
  ctx.moveTo(bx, wy); ctx.lineTo(bx, wy+wh);
  ctx.moveTo(wx, by_screen+bh*0.5); ctx.lineTo(wx+ww, by_screen+bh*0.5);
  ctx.stroke();

  ctx.restore();
}

function lighten(hex, amt){
  let c = parseInt(hex.slice(1),16);
  let r=Math.min(255,(c>>16)+Math.round(amt*255));
  let g=Math.min(255,((c>>8)&0xff)+Math.round(amt*255));
  let b=Math.min(255,(c&0xff)+Math.round(amt*255));
  return `rgb(${r},${g},${b})`;
}

// ── DRAW SKY & BG ──────────────────────────────────────────────
const SKY_COLS = ['#87ceeb','#7ec8e3','#c5f0e0','#ffe8c8','#fff4c2'];
let skyCol = '#87ceeb';

function drawSky(){
  // Sky gradient
  const sg = ctx.createLinearGradient(0,0,0,H*0.7);
  sg.addColorStop(0, darken(skyCol,0.1));
  sg.addColorStop(1, skyCol);
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,H);
}

function darken(hex,amt){
  let c=parseInt(hex.slice(1),16);
  let r=Math.max(0,(c>>16)-Math.round(amt*255));
  let g=Math.max(0,((c>>8)&0xff)-Math.round(amt*255));
  let b=Math.max(0,(c&0xff)-Math.round(amt*255));
  return `rgb(${r},${g},${b})`;
}

function drawClouds(dt){
  clouds.forEach(cl=>{
    cl.x += cl.speed * dt * 30;
    if(cl.x > W+200) cl.x = -300;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(100,160,220,0.3)'; ctx.shadowBlur = 12;
    // Cloud puffs
    [[0,0,1],[cl.w*0.3,-8,0.8],[cl.w*0.6,-5,0.7],[-cl.w*0.25,-4,0.65]].forEach(([ox,oy,sc])=>{
      ctx.beginPath();
      ctx.ellipse(cl.x+ox, cl.y+oy, cl.w*0.45*sc, cl.h*0.55*sc, 0, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  });
}

function drawBuildings(){
  buildings.forEach(b=>{
    const sy = getGroundSY();
    ctx.fillStyle = b.col;
    ctx.fillRect(W/2+b.x-b.bw/2-camY*0.05, sy-b.bh, b.bw, b.bh);
    // Windows
    ctx.fillStyle='rgba(255,240,120,0.4)';
    for(let r=0;r<Math.floor(b.bh/22);r++)
      for(let c=0;c<Math.floor(b.bw/16);c++)
        ctx.fillRect(W/2+b.x-b.bw/2+4+c*16-camY*0.05, sy-b.bh+8+r*22, 8, 12);
  });
}

function drawGround(){
  const sy = getGroundSY();
  // Ground strip
  const gg = ctx.createLinearGradient(0,sy,0,H);
  gg.addColorStop(0,'#5aab32'); gg.addColorStop(0.15,'#4a9028'); gg.addColorStop(1,'#3d7520');
  ctx.fillStyle=gg; ctx.fillRect(0,sy,W,H-sy);
  // Ground line
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(0,sy,W,3);
  // Platform base
  const pg = ctx.createLinearGradient(W/2-120,sy-8,W/2-120,sy+6);
  pg.addColorStop(0,'#e8d49a'); pg.addColorStop(1,'#c8a860');
  ctx.fillStyle=pg;
  ctx.beginPath(); ctx.roundRect(W/2-120,sy-8,240,16,4); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();
}

// ── CRANE DRAW ────────────────────────────────────────────────
function drawCrane(sw){
  if(!sw) return;
  const hudH = parseInt(document.getElementById('hud').getBoundingClientRect().bottom||60);
  const craneBaseY = hudH + 10;
  const craneBaseX = W/2;

  // Vertical pole
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=12;
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(craneBaseX-80, craneBaseY); ctx.lineTo(craneBaseX-80, craneBaseY-5);
  ctx.stroke();
  // Horizontal arm
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(craneBaseX-80, craneBaseY); ctx.lineTo(craneBaseX+80, craneBaseY);
  ctx.stroke();

  // Hook/pulley at swing point
  const hookX = craneBaseX + sw.angle * 70; // swing arm
  const ropeTopY = craneBaseY + 8;

  // Rope from crane to block
  ctx.strokeStyle='#aaa'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(craneBaseX, ropeTopY);
  ctx.lineTo(W/2 + sw.x, worldToScreen(0, sw.worldY).sy - BLOCK_H/2 - 8);
  ctx.stroke();
  ctx.setLineDash([]);

  // Hook circle
  ctx.beginPath(); ctx.arc(craneBaseX, ropeTopY, 7, 0, Math.PI*2);
  ctx.fillStyle='#888'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();

  // Crane stripes
  ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(craneBaseX-80, craneBaseY); ctx.lineTo(craneBaseX+80, craneBaseY); ctx.stroke();
}

// ── DRAW FULL FRAME ────────────────────────────────────────────
function draw(dt){
  ctx.save();
  if(shakeT>0){
    ctx.translate(shakeX*(Math.random()-.5)*2, shakeY*(Math.random()-.5));
    shakeT -= dt;
  }

  drawSky();
  drawClouds(dt);
  drawBuildings();
  drawGround();

  // Stacked tower blocks
  tower.forEach(b=>{
    const {sx,sy} = worldToScreen(b.cx, b.wy);
    drawBlock(sx, sy - BLOCK_H, b.w, BLOCK_H, b.col, b.col2);
  });

  // Falling dropped block
  if(dropping){
    const {sx,sy} = worldToScreen(dropping.cx, dropping.worldY);
    drawBlock(sx, sy - BLOCK_H, dropping.w, BLOCK_H, dropping.col, dropping.col2, 1);
  }

  // Debris
  debris.forEach(d=>{
    ctx.save();
    ctx.translate(d.sx, d.sy);
    ctx.rotate(d.rot);
    ctx.globalAlpha = d.alpha;
    const grad=ctx.createLinearGradient(-d.w/2,0,-d.w/2,d.h);
    grad.addColorStop(0,lighten(d.col,0.2)); grad.addColorStop(1,d.col2);
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.roundRect(-d.w/2,-d.h/2,d.w,d.h,4); ctx.fill();
    ctx.restore();
  });

  // Particles
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
    ctx.restore();
  });

  // Swinging block (crane)
  if(swing){
    const {sx,sy} = worldToScreen(swing.x, swing.worldY);
    drawCrane(swing);
    drawBlock(sx, sy - BLOCK_H, swing.w, BLOCK_H, swing.col, swing.col2);
  }

  ctx.restore();
}

// ── GAME LOGIC ─────────────────────────────────────────────────
function getStageIdx(){ return Math.min(4, Math.floor(floor/10)); }
function getBlockColor(fl){
  const i = Math.min(4, Math.floor(fl/10));
  return { col: RUKUN[i].col, col2: RUKUN[i].col2 };
}

function stackWorldY(){ // world y of top surface of topmost block
  if(!tower.length) return 0;
  return tower[tower.length-1].wy; // wy = top surface
}

function swingWorldY(){
  return stackWorldY() + BLOCK_H * 0.5 + 250; // hang well above stack
}

function spawnSwing(){
  const {col,col2} = getBlockColor(floor);
  const topW = tower.length ? tower[tower.length-1].w : BLOCK_W0;
  const w = topW; // same width, player must align
  swing = { x:0, worldY: swingWorldY(), w, col, col2, dir:1, angle:0, speed: 2.5 + Math.min(floor,50)*0.06 };
  targetCamY = stackWorldY() - (H - GROUND_SY) * (1 - CAM_LEAD) + BLOCK_H * 3;
}

function dropSwingBlock(){
  if(!swing || state !== 'play') return;
  SFX.drop();
  dropping = {
    cx: W/2 + swing.x,
    worldY: swing.worldY,
    w: swing.w, col: swing.col, col2: swing.col2,
    vy: 0
  };
  document.getElementById('hintEl').style.display='none';
  swing = null;
}

function spawnParticles(cx, worldY, col, n){
  const {sx,sy} = worldToScreen(cx, worldY);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const v = 1.5+Math.random()*4;
    particles.push({
      x:sx,y:sy, vx:Math.cos(a)*v, vy:-Math.abs(Math.sin(a))*v-2,
      r:3+Math.random()*5, col, alpha:1,
      life:0.6+Math.random()*0.7
    });
  }
}

function spawnDebris(cx, worldY, w, col, col2, dir){
  const {sx,sy} = worldToScreen(cx, worldY - BLOCK_H/2);
  debris.push({
    sx, sy, w: Math.max(4,w), h: BLOCK_H,
    col, col2, alpha:1,
    vx: dir*(2+Math.random()*3), vy:-2-Math.random()*3,
    rot:0, rotV: dir*(0.05+Math.random()*0.1),
    life: 2.0
  });
}

function popMsg(msg){
  const el=document.getElementById('popEl');
  el.textContent=msg; el.classList.remove('go');
  void el.offsetWidth; el.classList.add('go');
}

// ── UPDATE ─────────────────────────────────────────────────────
let lastT = performance.now();

function update(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;

  // Camera smooth follow
  camY += (targetCamY - camY) * (1 - Math.exp(-3*dt));

  // Swing oscillation
  if(swing && state==='play'){
    swing.angle += swing.dir * swing.speed * dt;
    if(Math.abs(swing.angle) > 1) swing.dir *= -1;
    swing.x = swing.angle * (W*0.38); // screen offset
    // Keep swing world Y above stack
    swing.worldY = swingWorldY();
  }

  // Falling block physics
  if(dropping && state==='play'){
    dropping.vy -= 0; // no gravity needed, just fall
    dropping.worldY -= (12 + Math.min(floor,30)*0.3) * dt * 60; // fall downward in world

    const topY = stackWorldY();
    if(dropping.worldY - BLOCK_H/2 <= topY){
      landing(dropping);
      dropping = null;
    }
    // Off screen bottom (missed platform somehow)
    if(dropping.worldY < camY - 300){
      SFX.fail(); dropping=null; endGame();
    }
  }

  // Debris update
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.vy += 18*dt; // gravity pulls down on screen
    d.sx += d.vx*dt*60; d.sy += d.vy*dt*60;
    d.rot += d.rotV*dt*60;
    if((d.life-=dt)<0 || d.sy>H+100){ debris.splice(i,1); }
    else if(d.life<0.5) d.alpha=d.life/0.5;
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60;
    p.vy+=6*dt; // gravity
    if((p.life-=dt)<0){ particles.splice(i,1); }
    else p.alpha=p.life<0.3?p.life/0.3:1;
  }

  // Sky color lerp
  const targetSky = SKY_COLS[getStageIdx()];
  skyCol = lerpColor(skyCol, targetSky, 1-Math.exp(-1*dt));

  // Clouds drift
  // (handled in draw)

  draw(dt);
  requestAnimationFrame(update);
}

function lerpColor(a, b, t){
  const ac=parseInt(a.replace('#','').replace('rgb(','').replace(')',''),16)||0;
  // simple: just switch when close enough
  return t > 0.99 ? b : a;
}

// ── LANDING ────────────────────────────────────────────────────
function landing(blk){
  const top = tower.length ? tower[tower.length-1] : null;
  const topX = top ? top.cx : 0; // world x center (always 0 for us)
  // We only use screen x for landing calc
  const screenTopX = W/2 + topX;
  const screenTopW = top ? top.w : BLOCK_W0;

  const bLeft  = blk.cx - blk.w/2;
  const bRight = blk.cx + blk.w/2;
  const tLeft  = screenTopX - screenTopW/2;
  const tRight = screenTopX + screenTopW/2;

  const lo = Math.max(bLeft, tLeft);
  const hi = Math.min(bRight, tRight);
  const overlap = hi - lo;
  const isPerfect = Math.abs(blk.cx - screenTopX) < 10;

  if(overlap < 8){ // missed!
    SFX.fail();
    spawnDebris(blk.cx-W/2, stackWorldY(), blk.w, blk.col, blk.col2, blk.cx>W/2?1:-1);
    shakeX=8; shakeY=5; shakeT=0.4;
    endGame();
    return;
  }

  combo++;
  SFX.place();

  // Chop debris
  if(!isPerfect){
    if(bLeft < tLeft) spawnDebris(bLeft+(tLeft-bLeft)/2-W/2, stackWorldY(), tLeft-bLeft, blk.col, blk.col2, -1);
    if(bRight > tRight) spawnDebris(tRight+(bRight-tRight)/2-W/2, stackWorldY(), bRight-tRight, blk.col, blk.col2, 1);
  }

  const newW = isPerfect ? Math.min(BLOCK_W0, blk.w + 12) : overlap;
  const newCX = (lo+hi)/2;
  const newWY = stackWorldY() + BLOCK_H; // top surface of new block

  if(isPerfect){
    SFX.perf();
    spawnParticles(newCX-W/2, newWY, '#ffd700', 30);
    popMsg(combo>=3 ? `Combo x${combo}! 🔥` : 'Sempurna! ✨');
  } else {
    spawnParticles(newCX-W/2, newWY, blk.col, 12);
  }

  tower.push({ cx:newCX, wy:newWY, w:newW, col:blk.col, col2:blk.col2 });
  floor = tower.length - 1;
  sessionCoins += isPerfect ? 3 : 1;
  SFX.coin();
  updateHUD();

  if(floor>0 && floor%10===0 && floor<=50){
    setTimeout(()=>showLesson(Math.floor(floor/10)-1), 300);
  } else {
    setTimeout(()=>spawnSwing(), 120);
  }
}

// ── HUD ────────────────────────────────────────────────────────
function updateHUD(){
  const i=getStageIdx();
  document.getElementById('hudFloor').textContent=floor;
  document.getElementById('hudCoins').textContent=sessionCoins;
  document.getElementById('hudRukun').textContent='🕌 '+RUKUN[i].n;
  document.getElementById('progBar').style.width=(floor>=50?100:(floor%10)*10)+'%';
  // update sky
  skyCol = SKY_COLS[i];
}

// ── LESSON ────────────────────────────────────────────────────
function showLesson(idx){
  state='lesson';
  sessionCoins+=10; SFX.lesson();
  spawnParticles(0, stackWorldY(), '#ffd700', 40);
  const r=RUKUN[idx];
  document.getElementById('lBadge').textContent='Rukun Islam ke-'+(idx+1);
  document.getElementById('lBadge').style.background=r.col;
  document.getElementById('lTitle').textContent=r.n;
  document.getElementById('lArab').textContent=r.a;
  document.getElementById('lLatin').textContent=r.l;
  document.getElementById('lMeaning').textContent=r.m;
  document.getElementById('lDesc').textContent=r.h;
  showOv('ovLesson');
}

// ── START / END ────────────────────────────────────────────────
function startGame(){
  tower=[]; debris=[]; particles=[]; dropping=null; swing=null;
  floor=0; combo=0; sessionCoins=0;
  camY=0; targetCamY=0;
  state='play';
  // Base platform block
  tower.push({ cx:W/2, wy:BLOCK_H, w:BLOCK_W0+40, col:RUKUN[0].col, col2:RUKUN[0].col2 });
  hideAll();
  document.getElementById('hud').style.display='block';
  document.getElementById('hintEl').style.display='block';
  updateHUD();
  skyCol=SKY_COLS[0];
  setTimeout(()=>spawnSwing(), 400);
}

function endGame(){
  if(state==='over') return;
  state='over';
  const stars=floor>=50?3:floor>=25?2:floor>=10?1:0;
  SV.best=Math.max(SV.best,floor);
  SV.coins+=sessionCoins; SV.stars=Math.max(SV.stars,stars); save();
  document.getElementById('hud').style.display='none';
  document.getElementById('hintEl').style.display='none';
  document.getElementById('resTitle').textContent=floor>=50?'🏆 MENARA SEMPURNA!':'🏚️ Menara Rubuh!';
  document.getElementById('resFloor').textContent=floor;
  document.getElementById('resCoins').textContent=sessionCoins;
  document.getElementById('resBest').textContent=SV.best;
  ['s1','s2','s3'].forEach((id,i)=>{
    const el=document.getElementById(id); el.classList.remove('lit');
    if(i<stars) setTimeout(()=>el.classList.add('lit'), 350+i*220);
  });
  const ri=Math.max(0,Math.min(4,Math.floor(floor/10)-(floor<10?0:1)));
  const r=RUKUN[ri];
  document.getElementById('resBadge').textContent='Pelajaran: '+r.n;
  document.getElementById('resBadge').style.background=r.col;
  document.getElementById('resArab').textContent=r.a;
  document.getElementById('resLatin').textContent=r.l;
  document.getElementById('resDesc').textContent=r.h;
  setTimeout(()=>showOv('ovResult'), 750);
}

function toMenu(){
  state='menu';
  document.getElementById('hud').style.display='none';
  document.getElementById('hintEl').style.display='none';
  document.getElementById('menuBest').textContent=SV.best;
  document.getElementById('menuStars').textContent=SV.stars;
  document.getElementById('menuCoins').textContent=SV.coins;
  showOv('ovMenu');
}

// ── UI HELPERS ─────────────────────────────────────────────────
function showOv(id){ document.querySelectorAll('.ov').forEach(o=>o.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function hideAll(){ document.querySelectorAll('.ov').forEach(o=>o.classList.add('hidden')); }

// ── EVENTS ────────────────────────────────────────────────────
document.getElementById('btnPlay').onclick=startGame;
document.getElementById('btnAgain').onclick=startGame;
document.getElementById('btnResMenu').onclick=toMenu;
document.getElementById('btnPauseMenu').onclick=toMenu;
document.getElementById('btnResume').onclick=()=>{ state='play'; hideAll(); };
document.getElementById('btnPause').onclick=()=>{ if(state==='play'){state='pause';showOv('ovPause');} };
document.getElementById('btnLessonNext').onclick=()=>{ hideAll(); state='play'; updateHUD(); setTimeout(()=>spawnSwing(),200); };
document.getElementById('btnMute').onclick=()=>{ muted=!muted; document.getElementById('btnMute').textContent=muted?'🔇':'🔊'; };

cv.addEventListener('pointerdown', ()=>{
  if(state==='play' && swing){ dropSwingBlock(); }
});
window.addEventListener('keydown', e=>{
  if((e.code==='Space'||e.code==='Enter')&&state==='play'){ e.preventDefault(); dropSwingBlock(); }
  if(e.code==='Escape'){ if(state==='play'){state='pause';showOv('ovPause');}else if(state==='pause'){state='play';hideAll();} }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'){state='pause';showOv('ovPause');} });

// ── MENU DRAW (idle animation) ─────────────────────────────────
let menuT=0;
function drawMenu(){
  menuT += 0.016;
  drawSky();
  drawClouds(0.016);
  drawBuildings();
  drawGround();
  // Demo stack of 6 blocks swaying
  for(let i=0;i<6;i++){
    const idx=Math.min(4,Math.floor(i/2));
    const bw=BLOCK_W0-i*14;
    const by=getGroundSY()-BLOCK_H-i*BLOCK_H;
    drawBlock(W/2, by, bw, BLOCK_H, RUKUN[idx].col, RUKUN[idx].col2);
  }
  // Swinging demo block
  const demoAngle=Math.sin(menuT)*0.8;
  const demoX=W/2+demoAngle*120;
  const demoY=getGroundSY()-BLOCK_H*8;
  // Rope
  ctx.strokeStyle='#aaa'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(W/2, 60); ctx.lineTo(demoX, demoY); ctx.stroke();
  ctx.setLineDash([]);
  drawBlock(demoX, demoY, BLOCK_W0-80, BLOCK_H, RUKUN[0].col, RUKUN[0].col2);
}

// ── INIT ──────────────────────────────────────────────────────
initBg();
toMenu();

// Separate menu animation loop
let menuRaf;
function menuLoop(){
  if(state==='menu'){ drawMenu(); menuRaf=requestAnimationFrame(menuLoop); }
}
menuLoop();

// Main game loop
requestAnimationFrame(update);
</script>

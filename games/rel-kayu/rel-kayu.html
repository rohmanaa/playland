<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choo-Choo Rel Kayu</title>
<style>
:root{--bg:#bfe3ff;--ui:#fffaf0;--ink:#4a3320;--line:#d9c3a0;--acc:#e8553d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1330;--ui:#2b2018;--ink:#f4e6d0;--line:#4a3a2a}}
:root[data-theme="dark"]{--bg:#0b1330;--ui:#2b2018;--ink:#f4e6d0;--line:#4a3a2a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:var(--ink);font-size:13px}
#top span,#top b{background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button{background:var(--ui);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:14px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
button:active{transform:translateY(2px);box-shadow:none}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#spd{width:80px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--ui);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><b>🚂 Choo-Choo Rel Kayu</b><span id="info">Seret: geser · Klik kanan / Shift: putar · Scroll / cubit: zoom</span></div>
<div id="toast"></div>
<div id="bar">
<button data-p="S" title="W / ↑">⬆️ Lurus</button>
<button data-p="L" title="A / ←">↰ Kiri</button>
<button data-p="R" title="D / →">↱ Kanan</button>
<button data-p="U" title="Q">⤴️ Naik</button>
<button data-p="N" title="E">⤵️ Turun</button>
<button id="mode" class="on" title="Ganti mode seret: geser / putar">✋ Geser</button>
<button id="undo" title="Backspace">↩️ Undo</button>
<button id="clr">🗑️ Hapus</button>
<button id="play" class="on">⏸️ Jeda</button>
<button id="rev">🔁 Balik</button>
<button id="follow">🎥 Ikuti</button>
<button id="horn">📯 Tuut</button>
<button id="nite">🌙 Malam</button>
<input id="spd" type="range" min="1" max="8" value="3" title="Kecepatan">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V=THREE.Vector3,R=2,D=[[0,1],[1,0],[0,-1],[-1,0]];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const canvas=$('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,400);
const hemi=new THREE.HemisphereLight(0xffffff,0x6a8f4a,.9);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(20,35,15);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=sc.bottom=-45;sc.right=sc.top=45;sc.near=1;sc.far=120;
scene.add(hemi,sun);

const M=c=>new THREE.MeshLambertMaterial({color:c});
const bx=new THREE.BoxGeometry(1,1,1),cy=new THREE.CylinderGeometry(1,1,1,12),co=new THREE.ConeGeometry(1,1,10);
const wood=[M(0xd9a566),M(0xc8914f)],railM=M(0x8b5a2b),pillM=M(0xb98550);
function mesh(g,m,sx,sy,sz,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.scale.set(sx,sy,sz);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}

// Ground, grid, trees, station
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),M(0x7bc15b));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(100,50,0x5a9a3f,0x5a9a3f);grid.position.y=.02;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
const trunkM=M(0x7a5230),leafM=[M(0x2e8b4f),M(0x3da65f)];
for(let i=0;i<50;i++){const a=Math.random()*6.283,r=24+Math.random()*60,s=.8+Math.random()*.9,t=new THREE.Group();
 t.add(mesh(cy,trunkM,.25,1,.25,0,.5,0),mesh(co,leafM[i%2],1.1,1.6,1.1,0,1.7,0),mesh(co,leafM[i%2],.8,1.3,.8,0,2.5,0));
 t.position.set(Math.cos(a)*r,0,Math.sin(a)*r);t.scale.setScalar(s);scene.add(t)}
scene.add(mesh(bx,M(0xf0e6d2),1.6,1,2.4,2.4,.5,2),mesh(bx,M(0xc0392b),1.9,.2,2.7,2.4,1.1,2));

// Track data
const start={x:0,y:0,z:0,h:0};let pieces=[],log=[],path=[],cum=[0],total=0,closed=false;
const trackG=new THREE.Group();scene.add(trackG);
function gen(type,s){
 const d=D[s.h],pts=[];let e;
 if(type==='S'||type==='U'||type==='N'){
  const dy=type==='U'?1:type==='N'?-1:0;
  for(let i=0;i<=6;i++){const t=i/6;pts.push(new V(s.x+d[0]*R*t,s.y+dy*t*t*(3-2*t),s.z+d[1]*R*t))}
  e={x:s.x+d[0]*R,y:s.y+dy,z:s.z+d[1]*R,h:s.h};
 }else{
  const nh=(s.h+(type==='L'?1:3))%4,d2=D[nh],cx=s.x+R*d2[0],cz=s.z+R*d2[1];
  for(let i=0;i<=10;i++){const a=i/10*Math.PI/2,c=Math.cos(a),n=Math.sin(a);
   pts.push(new V(cx+R*(-d2[0]*c+d[0]*n),s.y,cz+R*(-d2[1]*c+d[1]*n)))}
  e={x:cx+R*d[0],y:s.y,z:cz+R*d[1],h:nh};
 }
 return{pts,end:e};
}
function build(p){
 const g=new THREE.Group();
 for(let i=0;i<p.pts.length-1;i++){
  const a=p.pts[i],b=p.pts[i+1],len=a.distanceTo(b)*1.03,sg=new THREE.Group();
  sg.position.copy(a).add(b).multiplyScalar(.5);sg.lookAt(b);
  sg.add(mesh(bx,wood[i%2],1.1,.12,len,0,-.06,0),mesh(bx,railM,.09,.09,len,-.3,.04,0),mesh(bx,railM,.09,.09,len,.3,.04,0));
  g.add(sg);
 }
 const m=p.pts[Math.floor(p.pts.length/2)];
 [m,p.pts[p.pts.length-1]].forEach(q=>{if(q.y>.2)g.add(mesh(cy,pillM,.12,q.y,.12,q.x,q.y/2-.12,q.z))});
 return g;
}
const cur=()=>pieces.length?pieces[pieces.length-1].end:start;
const closes=e=>Math.hypot(e.x-start.x,e.z-start.z)<.01&&Math.abs(e.y-start.y)<.01&&e.h===start.h;
const toast=(t)=>{const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1600)};
function rebuildPath(){
 path=[new V(start.x,start.y,start.z)];cum=[0];
 pieces.forEach(p=>p.pts.slice(1).forEach(q=>{cum.push(cum[cum.length-1]+q.distanceTo(path[path.length-1]));path.push(q)}));
 total=cum[cum.length-1];closed=pieces.length>0&&closes(cur());
}
function add(type,silent){
 if(closed){if(!silent)toast('Loop sudah tertutup, tekan Undo untuk lanjut');return}
 const r=gen(type,cur());
 if(r.end.y<-.01){if(!silent)toast('Sudah di tanah, tidak bisa turun lagi');return}
 const loop=closes(r.end);
 if(!loop&&[start,...pieces.map(p=>p.end)].some(q=>Math.hypot(q.x-r.end.x,q.z-r.end.z)<.5&&Math.abs(q.y-r.end.y)<1.2)){if(!silent)toast('Terhalang rel lain');return}
 const p={type,pts:r.pts,end:r.end};p.group=build(p);trackG.add(p.group);
 pieces.push(p);log.push(type);rebuildPath();save();
 if(loop&&!silent)toast('🎉 Rel tersambung, kereta berputar terus!');
}
function undo(){const p=pieces.pop();if(!p)return;trackG.remove(p.group);log.pop();rebuildPath();save()}
function clearAll(){while(pieces.length)undo()}
function save(){try{localStorage.setItem('choo-track',log.join(''))}catch(e){}}

// Train
function mkCar(body,eng){
 const g=new THREE.Group();
 g.add(mesh(bx,M(body),.8,.45,eng?1.2:1.1,0,.5,0));
 [[-.42,.5],[.42,.5],[-.42,-.5],[.42,-.5]].forEach(([x,z])=>{const w=mesh(cy,M(0x333333),.17,.1,.17,x,.2,z);w.rotation.z=Math.PI/2;g.add(w)});
 if(eng){const b=mesh(cy,M(0x2b6cb0),.3,.75,.3,0,.82,.3);b.rotation.x=Math.PI/2;
  g.add(b,mesh(cy,M(0x222222),.09,.35,.09,0,1.12,.55),mesh(bx,M(0xf2b134),.8,.55,.45,0,.95,-.35))}
 return g;
}
const cars=[mkCar(0xe8553d,true),mkCar(0x3aa655),mkCar(0x8e5bd0)],offs=[0,1.5,2.8];
const glow=new THREE.PointLight(0xffe9a0,0,12);glow.position.set(0,.9,1);cars[0].add(glow);
cars.forEach(c=>scene.add(c));
let s=3,dir=1,playing=true,follow=false,night=false;
function sample(d){
 d=closed?((d%total)+total)%total:clamp(d,0,total);
 let lo=0,hi=cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;cum[m]<=d?lo=m:hi=m}
 const a=path[lo],b=path[hi],t=(d-cum[lo])/((cum[hi]-cum[lo])||1);
 return{p:a.clone().lerp(b,t),t:b.clone().sub(a).normalize()};
}

// Marker (end of track)
const marker=new THREE.Group(),mk=mesh(co,M(0xe8553d),.3,.8,.3);mk.rotation.x=Math.PI/2;mk.castShadow=false;marker.add(mk);scene.add(marker);

// Camera orbit
let th=.8,ph=.9,dist=22,panMode=true,tgt=new V(0,0,4);
function pan(dx,dy){const k=dist*.0016;tgt.x+=-dx*Math.cos(th)*k-dy*Math.sin(th)*k;tgt.z+=dx*Math.sin(th)*k-dy*Math.cos(th)*k}
const ptrs=new Map();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})});
canvas.addEventListener('pointermove',e=>{
 const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(ptrs.size===1){if(panMode!==!!(e.buttons&2||e.shiftKey)){pan(dx,dy);if(follow)$('follow').click()}else{th-=dx*.006;ph=clamp(ph-dy*.006,.12,1.5)}}
 else if(ptrs.size===2){const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
  const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
  dist=clamp(dist*d0/(d1||1),6,90);pan(dx/2,dy/2)}
 p.x=e.clientX;p.y=e.clientY});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>ptrs.delete(e.pointerId)));
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*(1+e.deltaY*.001),6,90)},{passive:false});

// UI
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>add(b.dataset.p));
$('mode').onclick=()=>{panMode=!panMode;$('mode').textContent=panMode?'✋ Geser':'🔄 Putar';$('mode').classList.toggle('on',panMode)};
$('undo').onclick=undo;
$('clr').onclick=()=>{if(pieces.length>2&&!confirm('Hapus semua rel?'))return;clearAll()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸️ Jeda':'▶️ Jalan';$('play').classList.toggle('on',playing)};
$('rev').onclick=()=>dir=-dir;
$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('on',follow)};
$('nite').onclick=()=>{night=!night;$('nite').textContent=night?'☀️ Siang':'🌙 Malam';
 const bg=new THREE.Color(night?0x0b1330:0xbfe3ff);scene.background=bg;scene.fog=new THREE.Fog(bg,60,170);
 hemi.intensity=night?.3:.9;sun.intensity=night?.15:.9;glow.intensity=night?1.4:0;
 ground.material.color.set(night?0x1d3a24:0x7bc15b);document.documentElement.dataset.theme=night?'dark':'light'};
let ac;$('horn').onclick=()=>{try{ac=ac||new AudioContext();[392,330].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();
 o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.7)})}catch(e){}};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={w:'S',arrowup:'S',a:'L',arrowleft:'L',d:'R',arrowright:'R',q:'U',e:'N'};
 if(m[k]){add(m[k]);e.preventDefault()}else if(k==='backspace'){undo();e.preventDefault()}else if(k===' '){$('play').click();e.preventDefault()}});
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.background=new THREE.Color(0xbfe3ff);scene.fog=new THREE.Fog(0xbfe3ff,60,170);document.documentElement.dataset.theme='light';

// Load saved track or preset
let saved=null;try{saved=localStorage.getItem('choo-track')}catch(e){}
(saved===null?'SS':saved).split('').forEach(t=>{if('SLRUN'.includes(t))add(t,true)});
tgt.set(0,0,2);

// Loop
let last=performance.now();
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 const has=total>0.1;cars.forEach(c=>c.visible=has);
 if(has){
  if(playing){s+=dir*$('spd').value*dt;
   if(!closed){const lo=Math.min(2.9,total/2);if(s>total){s=total;dir=-1}if(s<lo){s=lo;dir=1}}}
  cars.forEach((c,i)=>{const q=sample(s-dir*offs[i]);c.position.copy(q.p).y+=.08;c.lookAt(q.p.clone().add(q.t.multiplyScalar(dir)).setY(q.p.y+.08+q.t.y*dir*0))});
  if(follow)tgt.lerp(cars[0].position,.12);
 }
 const e=cur();marker.position.set(e.x,e.y+.7+Math.sin(now/250)*.12,e.z);marker.rotation.y=Math.atan2(D[e.h][0],D[e.h][1]);marker.visible=!closed;
 cam.position.set(tgt.x+dist*Math.sin(ph)*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
 renderer.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

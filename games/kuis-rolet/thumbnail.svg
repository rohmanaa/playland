<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="wheelBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e86de"/>
      <stop offset="100%" stop-color="#0c2461"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="22" fill="url(#wheelBg)"/>

  <!-- Roulette Wheel -->
  <g transform="translate(200, 120)" filter="url(#shadow)">
    <!-- Wheel Slices -->
    <path d="M0,0 L0,-90 A90,90 0 0,1 63,-63 Z" fill="#2ed573" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L63,-63 A90,90 0 0,1 90,0 Z" fill="#1e90ff" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L90,0 A90,90 0 0,1 63,63 Z" fill="#ffa502" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L63,63 A90,90 0 0,1 0,90 Z" fill="#9b59b6" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L0,90 A90,90 0 0,1 -63,63 Z" fill="#ff4757" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L-63,63 A90,90 0 0,1 -90,0 Z" fill="#00d2d3" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L-90,0 A90,90 0 0,1 -63,-63 Z" fill="#e67e22" stroke="#fff" stroke-width="2"/>
    <path d="M0,0 L-63,-63 A90,90 0 0,1 0,-90 Z" fill="#ffd32a" stroke="#fff" stroke-width="2"/>
    
    <!-- Center Knob -->
    <circle cx="0" cy="0" r="22" fill="#ff9f1a" stroke="#fff" stroke-width="3"/>
    <text x="0" y="6" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff" text-anchor="middle">GO</text>

    <!-- Pointer -->
    <polygon points="0,-102 -10,-82 10,-82" fill="#ff3f34" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Banner -->
  <rect x="50" y="235" width="300" height="44" rx="22" fill="#0c2461" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="264" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">
    KUIS ROLET <tspan fill="#ffd32a">BERKAH</tspan>
  </text>
</svg>

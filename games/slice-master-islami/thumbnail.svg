<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1e3f8"/>
      <stop offset="100%" stop-color="#8bb9e8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#002b5c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="400" height="300" rx="24" fill="url(#bgGrad)"/>

  <!-- Clouds -->
  <path d="M40 80 Q60 50 90 60 Q120 40 150 65 Q180 60 190 90 Q120 110 40 80 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M260 60 Q280 35 310 45 Q340 30 360 55 Q385 65 380 90 Q320 100 260 60 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Sliced Fruit 1: Semangka -->
  <g transform="translate(80, 190) rotate(-25)">
    <!-- Watermelon slice half -->
    <path d="M-30 0 A30 30 0 0 0 30 0 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="4"/>
    <path d="M-24 -2 A24 24 0 0 0 24 -2 Z" fill="#e74c3c"/>
    <circle cx="-8" cy="8" r="2" fill="#2c3e50"/>
    <circle cx="6" cy="10" r="2" fill="#2c3e50"/>
  </g>

  <!-- Sliced Fruit 2: Kurma -->
  <g transform="translate(300, 185) rotate(20)">
    <ellipse cx="0" cy="0" rx="28" ry="16" fill="#5c2b08" stroke="#3d1a04" stroke-width="3"/>
    <ellipse cx="-4" cy="-3" rx="10" ry="5" fill="#8d491c"/>
  </g>

  <!-- Wooden Cutting Post / Platform -->
  <rect x="130" y="210" width="140" height="80" rx="12" fill="#8e582d" stroke="#5c381a" stroke-width="4" filter="url(#shadow)"/>
  <rect x="138" y="210" width="124" height="14" rx="4" fill="#d35400"/>

  <!-- 3D Knife Tilted (Action Slash) -->
  <g transform="translate(200, 130) rotate(-35)" filter="url(#shadow)">
    <!-- Motion lines / trail -->
    <path d="M-50 -30 Q-20 20 10 50" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Handle -->
    <rect x="-10" y="40" width="20" height="55" rx="6" fill="#5a3d28" stroke="#2e1f14" stroke-width="3"/>
    <rect x="-14" y="32" width="28" height="12" rx="4" fill="url(#goldGrad)" stroke="#c68400" stroke-width="2"/>

    <!-- Sharp Blade -->
    <path d="M-8 32 L-14 -40 L0 -75 L14 -10 L8 32 Z" fill="url(#bladeGrad)" stroke="#ffffff" stroke-width="3"/>
    <!-- Blade Shine Ridge -->
    <path d="M0 -70 L0 32" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Juice Splatters -->
  <circle cx="160" cy="120" r="6" fill="#e74c3c"/>
  <circle cx="145" cy="105" r="4" fill="#e74c3c"/>
  <circle cx="250" cy="110" r="5" fill="#ffd447"/>
  <circle cx="265" cy="130" r="4" fill="#2ecc71"/>

  <!-- Logo Banner -->
  <g transform="translate(200, 260)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#1b4b84" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">
      SLICE <tspan fill="#ffd447">MASTER 3D</tspan>
    </text>
  </g>
</svg>

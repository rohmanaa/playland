<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tokoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#fd79a8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="22" fill="url(#tokoBg)"/>

  <!-- Character Avatar Circle -->
  <circle cx="200" cy="115" r="70" fill="#ffffff" filter="url(#shadow)"/>
  <text x="200" y="145" font-size="80" text-anchor="middle">👦</text>
  <text x="145" y="75" font-size="34">👑</text>
  <text x="245" y="160" font-size="34">📿</text>

  <!-- Title Banner -->
  <rect x="50" y="235" width="300" height="44" rx="22" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="264" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">
    TOKO KARAKTER <tspan fill="#ffd32a">HIJAIYAH</tspan>
  </text>
</svg>

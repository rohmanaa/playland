<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taman Siaga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe6a8;--panel:rgba(255,255,255,.9);--ink:#1f3d2b;--mute:#5f7f6b;--accent:#37c46b;--accent-d:#1e8a48;--gold:#ffc83d;--bad:#ef5a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Fredoka,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#g{inset:auto;left:0;top:64px;height:calc(100% - 64px);z-index:0}#c{z-index:1}#top,#bar,#hint{z-index:2}
.b-icon{width:1.4em;height:1.4em;flex:none}
.fill-putih-fade-light{fill:rgba(255,255,255,.9)}
.color-gray-light{color:#e4ebe6}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
#top>*{pointer-events:auto}.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid #fff;border-radius:99px;padding:4px 12px 4px 6px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(30,138,72,.25)}
.chip svg{width:26px;height:26px}#wv{padding:4px 14px}
.btn{font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(#55dd8b,var(--accent));border:3px solid #fff;border-radius:16px;padding:8px 14px;min-height:46px;box-shadow:0 5px 0 var(--accent-d);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.sm{padding:4px 10px;min-height:40px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.sec{background:linear-gradient(#8fd3ff,#4aa8e8);box-shadow:0 5px 0 #2b74a8}
.btn.bad{background:linear-gradient(#ff8a8a,var(--bad));box-shadow:0 5px 0 #a73030}
.btn:disabled{filter:grayscale(1);opacity:.6;cursor:default}
.btn:focus-visible,.tb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hint{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border-radius:99px;padding:5px 14px;font-weight:600;font-size:14px;max-width:92vw;text-align:center;pointer-events:none;display:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,rgba(30,90,50,.4))}
#tws,#abr{display:flex;gap:6px;justify-content:center}
.tb{font:inherit;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:3px solid #fff;border-radius:14px;padding:4px 6px;min-width:58px;cursor:pointer;color:var(--ink);font-weight:600;font-size:12px;box-shadow:0 3px 0 rgba(30,138,72,.3)}
.tb.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.55)}.tb:disabled{opacity:.55}
.tb .badge{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.tb .cs{display:flex;align-items:center;gap:3px;font-size:14px;font-weight:700}.tb .cs svg{width:16px;height:16px}
.tb .cd{position:absolute;inset:0;background:rgba(20,40,30,.55);transform-origin:bottom;transform:scaleY(var(--p,0));pointer-events:none}
#tp{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--bh,150px);margin-bottom:8px;display:none;gap:8px;align-items:center;background:var(--panel);border:3px solid #fff;border-radius:18px;padding:8px 10px;font-weight:600;z-index:3}
#tp.on{display:flex}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;background:radial-gradient(rgba(20,60,35,.3),rgba(10,30,20,.62));z-index:5}
#ov.on{display:flex}
.card{background:var(--panel);backdrop-filter:blur(8px);border:3px solid #fff;border-radius:26px;width:min(94vw,560px);max-height:88dvh;overflow:auto;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.4,.4,1);touch-action:pan-y;text-align:center}
@keyframes pop{from{transform:translateY(24px) scale(.9);opacity:0}}
.card h2{margin:0 0 10px;font-size:34px;color:#fff;-webkit-text-stroke:7px var(--accent-d);paint-order:stroke fill;text-shadow:0 4px 0 var(--accent-d)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.lv{flex-direction:column;gap:2px;font-size:22px;padding:10px 6px}.lv .st{display:flex}.lv .st svg{width:20px;height:20px}.lv .st .off{filter:grayscale(1);opacity:.35}
.big{display:flex;justify-content:center;gap:6px}.big svg{width:48px;height:48px}.off{filter:grayscale(1);opacity:.35}.col{display:flex;flex-direction:column;gap:10px}.set{display:flex;justify-content:space-between;align-items:center;font-weight:600}
#toast{position:fixed;top:calc(96px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
.t{background:#1f3d2b;color:#fff;padding:8px 18px;border-radius:99px;font-weight:600;animation:tin .25s;text-align:center;max-width:92vw}@keyframes tin{from{transform:translateY(-14px);opacity:0}}
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:radial-gradient(rgba(255,255,255,.05),rgba(20,80,40,.5));transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash h1{margin:0;font-size:clamp(46px,12vw,96px);line-height:1;color:#fff;-webkit-text-stroke:9px var(--accent-d);paint-order:stroke fill;text-shadow:0 7px 0 var(--accent-d)}
#splash p{margin:0;font-size:clamp(16px,3vw,22px);font-weight:600;color:#fff;text-shadow:0 2px 0 var(--accent-d)}
#splash .btn{font-size:24px;padding:12px 40px}
@media(max-width:480px){.tb{min-width:50px;padding:3px 4px}.tb b{display:none}.btn{font-size:14px;padding:6px 10px}.chip{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="g"></canvas><canvas id="c"></canvas>
<div id="top"><div class="chips"><div class="chip" id="cc"></div><div class="chip" id="hc"></div></div><div class="chip" id="wv"></div><div class="chips"><button class="btn sec sm" id="bp" aria-label="Jeda"></button><button class="btn sec sm" id="bfs" aria-label="Layar penuh"></button></div></div>
<div id="hint"></div><div id="tp"></div>
<div id="bar"><div id="tws"></div><div id="abr"></div></div>
<div id="toast"></div><div id="ov"></div>
<div id="splash"><h1>Taman Siaga</h1><p>Tanam penjaga, hentikan hama, selamatkan kebunmu.</p><button class="btn" id="play">MAIN</button></div>

if(G)updBar()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.stopPropagation();act(b.dataset.a,b.dataset.v)}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();if(!G||M||G.over)return;const q=toCell(e.clientX,e.clientY);hov=q;if(!q){sel=null;pk=-1;return updBar()}const t=G.occ[q[0]+','+q[1]];if(t){sel=t;pk=-1}else if(pk>=0)place(q[0],q[1]);else sel=null;updBar()});
cv.addEventListener('pointermove',e=>{hov=toCell(e.clientX,e.clientY)});
addEventListener('keydown',e=>{if(e.code==='Escape'){if(M==='pause')modal(0);else act('pause')}else if(G&&!M){if(e.key>='1'&&e.key<='5'){pk=+e.key-1;sel=null;updBar()}else if(e.code==='Space'){e.preventDefault();nextWave()}else if(e.code==='KeyP')act('pause')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;if(G&&!G.over&&!M)modal('pause');AC&&AC.suspend&&AC.suspend()}else{running=true;last=performance.now();AC&&AC.resume&&AC.resume();requestAnimationFrame(frame)}});
addEventListener('resize',resize);
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
/*==== BOOT ====*/
function boot(){load();initScene();$('cc').innerHTML=ICON('coin')+'<span id="cn">0</span>';$('hc').innerHTML=ICON('heart')+'<span id="hn">0</span>';$('wv').textContent='Taman Siaga';$('bp').innerHTML=ICON('pause');$('bp').dataset.a='pause';$('bfs').innerHTML=ICON('fs');$('bfs').onclick=fs;renderBar();resize();
$('play').onclick=()=>{au();$('splash').classList.add('off');setTimeout(()=>$('splash').remove(),600);modal('lv')};
requestAnimationFrame(t=>{last=t;frame(t)})}
boot();
</script></body></html>
